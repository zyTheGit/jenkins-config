name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Run tests
        run: uv run pytest tests/ -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            targets: all
            cli_asset: jenkins-build-linux
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
            targets: mcp
          # macos-13 已于 2025-12 下线，Intel 版改用 macos-15-intel（x86_64 最后一版镜像）
          - os: macos-15-intel
            suffix: macos-x64
            targets: mcp
          - os: macos-latest
            suffix: macos-arm64
            targets: all
            cli_asset: jenkins-build-macos
          - os: windows-latest
            suffix: win-x64
            targets: all
            cli_asset: jenkins-build-win.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Build binaries
        run: uv run python build.py --target ${{ matrix.targets }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Collect release assets
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
          CLI_ASSET: ${{ matrix.cli_asset }}
        run: |
          mkdir -p release
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mv "dist/jenkins-config-mcp$ext" "release/jenkins-config-mcp-$SUFFIX$ext"
          if [ -n "$CLI_ASSET" ]; then
            mv "dist/jenkins-build$ext" "release/$CLI_ASSET"
          fi
          ls -l release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > checksums.txt

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          # 带连字符的 tag（v1.0.0-rc.1 等）视为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}

  # npx 启动器要能下到二进制，所以必须等 release job 把资产传完
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺少 NPM_TOKEN secret，无法发布。在仓库 Settings → Secrets 添加 npm Automation token。"
            exit 1
          fi

      # tag 是版本的唯一来源，避免 package.json 与 Release 资产版本漂移
      - name: Sync package version with tag
        working-directory: npm
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 预发布版本发到 next 频道，不抢占 latest
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"


